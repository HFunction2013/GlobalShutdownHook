# ============================================================
#  GlobalShutdownHook - GitHub Actions CI
#
#  - Build: Windows x64 (Release/Debug) with WDK
#  - Artifacts: upload .sys + .exe
# ============================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  SOLUTION: GlobalShutdownHook.sln
  PLATFORM: x64

jobs:
  # ============================================================
  #  Job 1: Build kernel driver + user app on Windows
  # ============================================================
  build:
    name: Build ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Install Windows SDK 10.0.26100 (includes km headers:
      # ntddk.h, wdm.h, ntifs.h under Include\10.0.26100.0\km\).
      # The runner may have a newer SDK but lack this exact
      # version's km folder; install with all features.
      # --------------------------------------------------------
      - name: Install Windows SDK 10.0.26100
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2320455"
          $sdkExe = Join-Path $env:TEMP "winsdksetup.exe"
          Write-Host "Downloading Windows SDK 10.0.26100 ..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkExe
          Write-Host "Installing SDK silently ..."
          $p = Start-Process -FilePath $sdkExe `
            -ArgumentList "/features","+","/quiet","/norestart" `
            -Wait -PassThru -NoNewWindow
          Write-Host "SDK installer exit code: $($p.ExitCode)"
          $ntifs = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\ntifs.h"
          if (Test-Path $ntifs) {
            Write-Host "OK: SDK 26100 + ntifs.h verified"
          } else {
            Write-Host "ERROR: ntifs.h not found. Available SDKs:"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object Name
            exit 1
          }


      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # --------------------------------------------------------
      # Build the solution
      # --------------------------------------------------------
      - name: Build ${{ matrix.configuration }}|${{ env.PLATFORM }}
        shell: cmd
        run: |
          msbuild %SOLUTION% /p:Configuration=${{ matrix.configuration }} /p:Platform=%PLATFORM% /m /v:minimal /nologo

      - name: List build output
        shell: pwsh
        run: |
          $outDir = "bin\$env:PLATFORM\${{ matrix.configuration }}"
          if (Test-Path $outDir) {
            Get-ChildItem $outDir | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            Write-Output "Output directory not found: $outDir"
          }

      # --------------------------------------------------------
      # Upload artifacts
      # --------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlobalShutdownHook-${{ env.PLATFORM }}-${{ matrix.configuration }}
          path: |
            bin/${{ env.PLATFORM }}/${{ matrix.configuration }}/GlobalShutdownHook.sys
            bin/${{ env.PLATFORM }}/${{ matrix.configuration }}/ShutdownHookClient.exe
            bin/${{ env.PLATFORM }}/${{ matrix.configuration }}/ShutdownHookBgSrv.exe
            bin/${{ env.PLATFORM }}/${{ matrix.configuration }}/*.pdb
          if-no-files-found: error
          retention-days: 30
