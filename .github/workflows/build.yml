# ============================================================
#  GlobalShutdownHook - GitHub Actions CI
#
#  - Build: Windows x64 (Release/Debug) with WDK
#  - Lint:  source integrity checks (Ubuntu)
#  - Artifacts: upload .sys + .exe
# ============================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  SOLUTION: GlobalShutdownHook.sln
  PLATFORM: x64

jobs:
  # ============================================================
  #  Job 1: Build kernel driver + user app on Windows
  # ============================================================
  build:
    name: Build ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Install Windows SDK 10.0.26100 (includes km headers:
      # ntddk.h, wdm.h, ntifs.h under Include\10.0.26100.0\km\).
      # The runner may have a newer SDK but lack this exact
      # version's km folder; install with all features.
      # --------------------------------------------------------
      - name: Install Windows SDK 10.0.26100
        shell: powershell
        timeout-minutes: 20
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2320455"
          $sdkExe = Join-Path $env:TEMP "winsdksetup.exe"
          Write-Host "Downloading Windows SDK 10.0.26100 ..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkExe
          Write-Host "Installing SDK silently (all features) ..."
          $p = Start-Process -FilePath $sdkExe `
            -ArgumentList "/features","+","/quiet","/norestart" `
            -Wait -PassThru -NoNewWindow
          Write-Host "SDK installer exit code: $($p.ExitCode)"

          # Verify kernel headers we actually compile against
          $kmDir = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km"
          $allFound = $true
          foreach ($hdr in @("ntddk.h", "wdm.h", "ntifs.h")) {
            $path = Join-Path $kmDir $hdr
            if (Test-Path $path) {
              Write-Host "OK: $hdr found"
            } else {
              Write-Host "MISSING: $hdr not found in $kmDir"
              $allFound = $false
            }
          }

          if (-not $allFound) {
            Write-Host "ERROR: Required kernel headers missing."
            Write-Host "Available SDK versions:"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object Name
            exit 1
          }
          Write-Host "SDK 26100 + kernel headers verified."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # --------------------------------------------------------
      # Build the solution
      # --------------------------------------------------------
      - name: Build ${{ matrix.configuration }}|${{ env.PLATFORM }}
        shell: cmd
        run: |
          msbuild %SOLUTION% /p:Configuration=${{ matrix.configuration }} /p:Platform=%PLATFORM% /m /v:minimal /nologo

      - name: List build output
        shell: pwsh
        run: |
          $outDir = "bin\$env:PLATFORM\${{ matrix.configuration }}"
          if (Test-Path $outDir) {
            Get-ChildItem $outDir | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            Write-Output "Output directory not found: $outDir"
          }

      # --------------------------------------------------------
      # Upload artifacts
      # --------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlobalShutdownHook-${{ env.PLATFORM }}-${{ matrix.configuration }}
          path: |
            bin/${{ env.PLATFORM }}/${{ matrix.configuration }}/GlobalShutdownHook.sys
            bin/${{ env.PLATFORM }}/${{ matrix.configuration }}/ShutdownHookClient.exe
            bin/${{ env.PLATFORM }}/${{ matrix.configuration }}/*.pdb
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  #  Job 2: Source integrity checks (Ubuntu, fast)
  # ============================================================
  lint:
    name: Source Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify all source files in vcxproj
        run: |
          echo "=== Checking driver vcxproj references ==="
          missing=0
          for f in driver/*.c driver/*.h; do
            fname=$(basename "$f")
            if ! grep -q "$fname" driver/GlobalShutdownHook.vcxproj; then
              echo "  MISSING: $fname not in driver vcxproj"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -eq 0 ]; then
            echo "  All driver source files referenced."
          fi

          echo ""
          echo "=== Checking userapp vcxproj references ==="
          for f in userapp/*.c; do
            fname=$(basename "$f")
            if ! grep -q "$fname" userapp/ShutdownHookClient.vcxproj; then
              echo "  MISSING: $fname not in userapp vcxproj"
              missing=$((missing + 1))
            fi
          done
          echo "  Done."

          if [ $missing -gt 0 ]; then
            echo ""
            echo "ERROR: $missing file(s) missing from vcxproj"
            exit 1
          fi

      - name: Check for tabs in C source
        run: |
          echo "=== Checking for tabs (should use spaces) ==="
          count=$(grep -rlP "\t" --include="*.c" --include="*.h" driver/ userapp/ test/ 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "  WARNING: $count file(s) contain tabs:"
            grep -rlP "\t" --include="*.c" --include="*.h" driver/ userapp/ test/ 2>/dev/null | sed 's/^/    /'
          else
            echo "  No tabs found. Good."
          fi

      - name: Check file encoding
        run: |
          echo "=== Checking source file encoding ==="
          bad=0
          while IFS= read -r f; do
            enc=$(file -b --mime-encoding "$f")
            if [ "$enc" != "utf-8" ] && [ "$enc" != "us-ascii" ] && [ "$enc" != "binary" ]; then
              echo "  NON-UTF8: $f ($enc)"
              bad=$((bad + 1))
            fi
          done < <(find . -type f \( -name "*.c" -o -name "*.h" \))
          if [ $bad -eq 0 ]; then
            echo "  All source files are UTF-8/ASCII. Good."
          fi

      - name: Check for TODO/FIXME markers
        run: |
          echo "=== TODO / FIXME markers ==="
          grep -rn "TODO\|FIXME\|XXX\|HACK" --include="*.c" --include="*.h" driver/ userapp/ test/ 2>/dev/null || echo "  None found."

      - name: Count lines of code
        run: |
          echo "=== Code statistics ==="
          c_files=$(find . -name "*.c" | wc -l)
          h_files=$(find . -name "*.h" | wc -l)
          c_lines=$(find . -name "*.c" -exec cat {} + | wc -l)
          h_lines=$(find . -name "*.h" -exec cat {} + | wc -l)
          echo "  C files:   $c_files ($c_lines lines)"
          echo "  H files:   $h_files ($h_lines lines)"
          echo "  Total:     $((c_files + h_files)) files, $((c_lines + h_lines)) lines"
