# ============================================================
#  GlobalShutdownHook - GitHub Actions CI
#
#  - Build: Windows x64 (Release/Debug) with WDK
#  - Artifacts: upload .sys + .exe + .pdb
# ============================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  SOLUTION: GlobalShutdownHook.sln
  PLATFORM: x64

jobs:
  # ============================================================
  #  Job 1: Build kernel driver + user app on Windows
  # ============================================================
  build:
    name: Build Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Cache Windows SDK 10.0.26100 layout
      # --------------------------------------------------------
      - name: Cache Windows SDK 10.0.26100 layout
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: C:\winsdk-layout\10.0.26100.0
          key: winsdk-10.0.26100.0-layout-v1
          restore-keys: |
            winsdk-10.0.26100.0-layout-

      - name: Download SDK layout (only on cache miss)
        shell: powershell
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2320455"
          $sdkExe = Join-Path $env:TEMP "winsdksetup.exe"
          Write-Host "Downloading Windows SDK 10.0.26100 layout ..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkExe
          Write-Host "Extracting offline layout to C:\winsdk-layout\10.0.26100.0 ..."
          Start-Process -FilePath $sdkExe `
            -ArgumentList "/layout","C:\winsdk-layout\10.0.26100.0","/quiet" `
            -Wait -NoNewWindow
          Remove-Item $sdkExe -Force -ErrorAction SilentlyContinue

      - name: Install Windows SDK 10.0.26100
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $layout = "C:\winsdk-layout\10.0.26100.0"
          $sdkExe = Join-Path $layout "winsdksetup.exe"
          if (-not (Test-Path $sdkExe)) {
            Write-Error "Layout installer not found: $sdkExe"
            exit 1
          }
          Write-Host "Installing SDK silently from local layout ..."
          $p = Start-Process -FilePath $sdkExe `
            -ArgumentList "/features","+","/quiet","/norestart" `
            -Wait -PassThru -NoNewWindow
          Write-Host "SDK installer exit code: $($p.ExitCode)"
          $ntifs = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\ntifs.h"
          if (Test-Path $ntifs) {
            Write-Host "OK: SDK 26100 + ntifs.h verified"
          } else {
            Write-Host "ERROR: ntifs.h not found. Available SDKs:"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object Name
            exit 1
          }


      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # --------------------------------------------------------
      # Build the solution
      # --------------------------------------------------------
      - name: Build Release|${{ env.PLATFORM }}
        shell: cmd
        run: |
          msbuild %SOLUTION% /p:Configuration=Release /p:Platform=%PLATFORM% /m /v:minimal /nologo

      - name: List build output
        shell: pwsh
        run: |
          $outDir = "bin\$env:PLATFORM\Release"
          if (Test-Path $outDir) {
            Get-ChildItem $outDir | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            Write-Output "Output directory not found: $outDir"
          }

      # --------------------------------------------------------
      # Upload artifacts - Binaries only
      # --------------------------------------------------------
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: GlobalShutdownHook-${{ env.PLATFORM }}-Release-bin
          path: |
            bin/${{ env.PLATFORM }}/Release/*.sys
            bin/${{ env.PLATFORM }}/Release/*.exe
            bin/${{ env.PLATFORM }}/Release/*.dll

          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # Upload artifacts - PDB symbols only
      # --------------------------------------------------------
      - name: Upload PDB symbols
        uses: actions/upload-artifact@v4
        with:
          name: GlobalShutdownHook-${{ env.PLATFORM }}-Release-pdb
          path: |
            bin/${{ env.PLATFORM }}/Release/*.pdb
          if-no-files-found: warn
          retention-days: 30